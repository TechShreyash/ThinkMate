name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting
        run: uv run --locked --extra dev black --check .

      - name: Check lint and imports
        run: uv run --locked --extra dev ruff check .

      - name: Run regression tests
        run: uv run --locked --extra dev python -m pytest -q
