[project]
name = "thinkmate"
version = "0.1.0"
description = "ThinkMate — a self-learning, long-term-memory Telegram AI companion (aiogram + MongoDB + OpenAI-compatible LLMs)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.31.0",
    "python-dotenv>=1.2.4",
    "motor>=3.7.1",
    "openai>=3.28.0",
    "pydantic>=2.13.5,<2.14",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "mongomock>=4.3.0",
    "hypothesis>=6.169.0",
]

[tool.uv]
prerelease = "disallow"

[tool.pytest.ini_options]
# Make `app` importable without installation and run async tests automatically.
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
